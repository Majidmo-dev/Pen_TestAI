# Egress allowlist for the agent: the LLM API and nothing else.
http_port 3128
acl llm_api dstdomain api.openai.com
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny !SSL_ports
http_access deny CONNECT !SSL_ports
http_access allow CONNECT llm_api
http_access deny all
cache deny all
access_log stdio:/dev/stdout
